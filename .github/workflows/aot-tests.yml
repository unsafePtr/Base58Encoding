name: Native AOT tests

# The shared x64 v2 baseline exercises Vector128; x86-64-v3 publishes exercise Vector256.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  aot:
    name: ${{ matrix.target.rid }} (${{ matrix.framework }}, ${{ matrix.target.instruction-set || 'default' }})
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        target:
          - { runner: ubuntu-24.04,     rid: linux-x64,   instruction-set: x86-64-v2,   vector-width: '128' }
          - { runner: ubuntu-24.04,     rid: linux-x64,   instruction-set: x86-64-v3,   vector-width: '256' }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64, instruction-set: '',          vector-width: '128' }
          - { runner: macos-26,         rid: osx-arm64,   instruction-set: '',          vector-width: '128' }
          - { runner: windows-2025,     rid: win-x64,     instruction-set: x86-64-v3,   vector-width: '256' }

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    # ILC links through clang and needs zlib's headers.
    - name: Install native toolchain (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    # ARM64 retains the runtime's default instruction set.
    - name: Publish (Native AOT)
      shell: bash
      run: |
        dotnet publish src/Base58Encoding.Tests/Base58Encoding.Tests.csproj \
          --configuration Release --framework ${{ matrix.framework }} --runtime ${{ matrix.target.rid }} \
          --output aot-out -p:PublishAot=true -p:IlcInstructionSet=${{ matrix.target.instruction-set }} \
          2>&1 | tee publish.log

    # Strip project-path suffixes so warnings from dependencies are not attributed to this library.
    - name: Assert no AOT/trim warnings from the library
      shell: bash
      run: |
        ours=$(grep -E 'warning IL[0-9]+' publish.log | sed -E 's/ \[[^][]*\]$//' | grep 'Base58Encoding' || true)
        if [ -n "$ours" ]; then
          echo "::error::Base58Encoding produced trim/AOT warnings:"
          echo "$ours"
          exit 1
        fi

    # No `dotnet` in front: a standalone binary. bash resolves the .exe suffix on Windows.
    - name: Run the suite natively
      shell: bash
      env:
        BASE58_EXPECT_VECTOR_WIDTH: ${{ matrix.target.vector-width }}
      run: |
        chmod +x aot-out/Base58Encoding.Tests*
        ./aot-out/Base58Encoding.Tests | tee native.log

    # AOT discovery can omit tests that reflection finds. Compare totals, which include skipped tests.
    # Use the last summary because a failing fallback test also prints its child process's summary.
    - name: Discovery parity with the JIT package
      if: matrix.target.rid == 'linux-x64' && matrix.target.instruction-set == 'x86-64-v2'
      shell: bash
      run: |
        dotnet run --project src/Base58Encoding.Tests/Base58Encoding.Tests.csproj \
          --configuration Release --framework ${{ matrix.framework }} | tee jit.log
        native=$(grep -oP 'Total: \K[0-9]+' native.log | tail -1)
        jit=$(grep -oP 'Total: \K[0-9]+' jit.log | tail -1)
        echo "native discovered $native, JIT discovered $jit"
        if [ -z "$native" ] || [ -z "$jit" ]; then
          echo "::error::could not parse a test count from one of the runs"
          exit 1
        fi
        if [ "$native" != "$jit" ]; then
          echo "::error::source-generated discovery found $native tests, reflection found $jit"
          exit 1
        fi
