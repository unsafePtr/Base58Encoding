name: Tests

# JIT feature switches exercise the scalar and Vector128 fallbacks in child processes on each framework.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform.rid }} (${{ matrix.framework }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        platform:
          - { runner: ubuntu-24.04,     rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-2025,     rid: win-x64 }
          - { runner: macos-26,         rid: osx-arm64 }

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore
      run: dotnet restore src/Base58Encoding.slnx

    - name: Build
      run: dotnet build src/Base58Encoding.slnx --configuration Release --framework ${{ matrix.framework }} --no-restore

    - name: Test
      run: dotnet run --project src/Base58Encoding.Tests/Base58Encoding.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-build

    - name: Check package targets
      if: matrix.platform.rid == 'linux-x64' && matrix.framework == 'net11.0'
      shell: bash
      run: |
        dotnet pack src/Base58Encoding/Base58Encoding.csproj --configuration Release --no-restore --output artifacts/packages
        package=$(find artifacts/packages -name '*.nupkg' -print -quit)
        unzip -Z1 "$package" > package-files.txt
        for framework in net10.0 net11.0; do
          grep -Fx "lib/$framework/Base58Encoding.dll" package-files.txt
        done
